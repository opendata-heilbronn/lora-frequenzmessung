services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-storage:/var/lib/postgresql/data
    networks: [app-net]
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks: [app-net]
    restart: unless-stopped

  backend:
    image: codeberg.org/opendata-heilbronn/backend:${IMAGE_TAG}
    environment:
      DB_DSN: postgres://timescaledb:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: [db]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  management:
    image: codeberg.org/opendata-heilbronn/management:${IMAGE_TAG}
    environment:
      BACKEND_INTERNAL_URL: http://backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TTN_APP_ID: ${TTN_APP_ID}
      TTN_API_KEY: ${TTN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${MANAGEMENT_PORT:-127.0.0.1:3002}:3002"
    depends_on: [backend]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  aggregator:
    image: codeberg.org/opendata-heilbronn/aggregator:${IMAGE_TAG}
    environment:
      BROKER_HOST: mosquitto
      BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      TOPIC: ${TOPIC}
      BACKEND_URL: http://backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: [backend, mosquitto]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: codeberg.org/opendata-heilbronn/frontend:${IMAGE_TAG}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on: [management]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      DOCKER_CONFIG: /config.json
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-300}"
    networks: [app-net]

volumes:
  db-storage:

networks:
  app-net:
