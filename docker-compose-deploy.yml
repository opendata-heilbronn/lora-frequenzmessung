version: '3.3'

services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MANAGEMENT_DB_USER: ${MANAGEMENT_DB_USER}
      MANAGEMENT_DB_PASSWORD: ${MANAGEMENT_DB_PASSWORD}
    volumes:
      - db-storage:/var/lib/postgresql/data
      - ./docker/timescaledb-init:/docker-entrypoint-initdb.d:ro
    networks: [app-net,stats_default]
    restart: unless-stopped
  db-backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    networks: [app-net]
    depends_on: [db]
    volumes:
      - ./backup:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: timescaledb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 0
      POSTGRES_EXTRA_OPTS: "--format=custom --compress=9"
  backend:
    image: codeberg.org/cfhn/lora-frequenzmessung/backend:${IMAGE_TAG}
    environment:
      DB_DSN: postgres://timescaledb:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: [db]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  management:
    image: codeberg.org/cfhn/lora-frequenzmessung/management:${IMAGE_TAG}
    environment:
      DATABASE_URI: postgres://${MANAGEMENT_DB_USER}:${MANAGEMENT_DB_PASSWORD}@db:5432/management?sslmode=disable
      BACKEND_INTERNAL_URL: http://backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      TTN_APP_ID: ${TTN_APP_ID}
      TTN_API_KEY: ${TTN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      FIRMWARE_CHANNEL: ${FIRMWARE_CHANNEL}
    depends_on: [db, backend]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  aggregator:
    image: codeberg.org/cfhn/lora-frequenzmessung/aggregator:${IMAGE_TAG}
    environment:
      BROKER_HOST: ${BROKER_HOST}
      BROKER_PORT: ${BROKER_PORT}
      CLIENTID: ${CLIENTID}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      TOPIC: ${TOPIC}
      BACKEND_URL: http://backend:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: [backend]
    networks: [app-net]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: codeberg.org/cfhn/lora-frequenzmessung/frontend:${IMAGE_TAG}
    depends_on: [management]
    networks: [app-net, traefik_net]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      traefik.enable: "true"
      traefik.docker.network: "traefik_net"
      traefik.port: "80"
      traefik.frontend.rule: "Host: ${HOSTNAME}"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    environment:
      DOCKER_CONFIG: /config.json
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL}"
    networks: [app-net]

volumes:
  db-storage:

networks:
  app-net:
  traefik_net:
    external: true
  stats_default:
    external: true