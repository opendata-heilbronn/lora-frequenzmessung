sonar.projectKey=lorax
sonar.host.url=https://sonarqube.mari0.dev

# Exclusions (applied regardless of per-pipeline source scoping)
sonar.exclusions=backend/vendor/**,frontend/node_modules/**,frontend/dist/**,frontend/playwright-report/**

# sonar.sources, sonar.tests, sonar.go.coverage.reportPaths, and
# sonar.javascript.lcov.reportPaths are intentionally NOT set here.
# Each CI pipeline passes only the paths relevant to its component via
# -D flags so that a pipeline without coverage data for a component
# does not overwrite that component's coverage in SonarQube.
