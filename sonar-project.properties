sonar.projectKey=lorax
sonar.host.url=https://sonarqube.mari0.dev

# Sources — all components
sonar.sources=backend,frontend/src

# Exclusions
sonar.exclusions=backend/vendor/**,frontend/node_modules/**,frontend/dist/**,frontend/playwright-report/**

# Go test config
sonar.tests=backend
sonar.test.inclusions=backend/**/*_test.go
sonar.go.coverage.reportPaths=backend/coverage.out

# TypeScript/Vue
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# OWASP Dependency-Check
sonar.dependencyCheck.jsonReportPath=dependency-check-report.json
