name: CI – Aggregator (Go)

on:
  pull_request:
    paths:
      - backend/Aggregator/**
      - backend/structs/**
      - backend/internal/**
      - backend/Share/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci/ci-aggregator.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Aggregator
        run: go build -o /dev/null ./Aggregator/...

  security-analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for OWASP Dependency-Check)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Get date for NVD cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: nvd-data-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: nvd-data-${{ runner.os }}-

      - name: Cache OWASP Dependency-Check binary
        id: cache-dc
        uses: actions/cache@v4
        with:
          path: /tmp/dependency-check
          key: dependency-check-10.0.4-linux

      - name: Download OWASP Dependency-Check
        if: steps.cache-dc.outputs.cache-hit != 'true'
        run: |
          curl -sSLo /tmp/dc.zip \
            https://github.com/dependency-check/DependencyCheck/releases/download/v10.0.4/dependency-check-10.0.4-release.zip
          unzip -q /tmp/dc.zip -d /tmp/

      - name: Update NVD database
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          /tmp/dependency-check/bin/dependency-check.sh \
            --updateonly \
            --data ~/.dependency-check/data \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}

      - name: Run OWASP Dependency-Check
        working-directory: ${{ github.workspace }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          /tmp/dependency-check/bin/dependency-check.sh \
            --project lorax \
            --scan backend/ \
            --format JSON \
            --out . \
            --data ~/.dependency-check/data \
            --exclude "**/vendor/**" \
            --noupdate \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}

      - name: Cache sonar-scanner
        id: cache-sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/sonar-scanner-8.0.1.6346-linux-x64
          key: sonar-scanner-8.0.1.6346

      - name: Install sonar-scanner
        if: steps.cache-sonar.outputs.cache-hit != 'true'
        run: |
          curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/

      - name: Add sonar-scanner to PATH
        run: echo "$HOME/.sonar/sonar-scanner-8.0.1.6346-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        working-directory: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          DC_FLAG=""
          [ -f dependency-check-report.json ] && DC_FLAG="-Dsonar.dependencyCheck.jsonReportPath=dependency-check-report.json"
          sonar-scanner -Dsonar.token=$SONAR_TOKEN $DC_FLAG
