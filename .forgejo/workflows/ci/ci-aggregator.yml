name: CI – Aggregator (Go)

on:
  pull_request:
    paths:
      - backend/Aggregator/**
      - backend/pkg/structs/**
      - backend/internal/**
      - backend/pkg/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci/ci-aggregator.yml

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Aggregator
        run: go build -o /dev/null ./Aggregator/...

  security-analysis:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get date for Trivy DB cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scan
        working-directory: ${{ github.workspace }}
        run: |
          trivy fs \
            --scanners vuln \
            --format sarif \
            --output trivy-report.sarif \
            --cache-dir ~/.cache/trivy \
            --exit-code 0 \
            backend/

      - name: Cache sonar-scanner
        id: cache-sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/sonar-scanner-8.0.1.6346-linux-x64
          key: sonar-scanner-8.0.1.6346

      - name: Install sonar-scanner
        if: steps.cache-sonar.outputs.cache-hit != 'true'
        run: |
          curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/

      - name: Add sonar-scanner to PATH
        run: echo "$HOME/.sonar/sonar-scanner-8.0.1.6346-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        working-directory: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.host.url=https://sonarqube.mari0.dev \
            -Dsonar.projectKey=lorax-aggregator \
            -Dsonar.projectName="Lorax – Aggregator" \
            -Dsonar.projectBaseDir=${{ github.workspace }}/backend \
            -Dsonar.sources=Aggregator,pkg \
            -Dsonar.exclusions=vendor/** \
            -Dsonar.sarifReportPaths=${{ github.workspace }}/trivy-report.sarif
