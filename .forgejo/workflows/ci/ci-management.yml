name: CI – ManagementAPI (Go)

on:
  pull_request:
    paths:
      - backend/ManagementAPI/**
      - backend/structs/**
      - backend/internal/**
      - backend/Share/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci-management.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build ManagementAPI
        run: go build ./ManagementAPI/...

      - name: Run ManagementAPI tests
        run: go test -v ./ManagementAPI/... ./Share/...
