name: CI – ManagementAPI (Go)

on:
  pull_request:
    paths:
      - backend/ManagementAPI/**
      - backend/structs/**
      - backend/internal/**
      - backend/Share/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci/ci-management.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build ManagementAPI
        run: go build -o /dev/null ./ManagementAPI/...

      - name: Run ManagementAPI tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -v ./ManagementAPI/... ./Share/...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: management-coverage
          path: backend/coverage.out
          retention-days: 1

  security-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: management-coverage
          path: backend/

      - name: Cache sonar-scanner
        id: cache-sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/sonar-scanner-8.0.1.6346-linux-x64
          key: sonar-scanner-8.0.1.6346

      - name: Install sonar-scanner
        if: steps.cache-sonar.outputs.cache-hit != 'true'
        run: |
          curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/

      - name: Add sonar-scanner to PATH
        run: echo "$HOME/.sonar/sonar-scanner-8.0.1.6346-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        working-directory: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner -Dsonar.token=$SONAR_TOKEN
