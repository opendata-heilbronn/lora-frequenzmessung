name: CI – Backend (Go)

on:
  pull_request:
    paths:
      - backend/Backend/**
      - backend/structs/**
      - backend/internal/**
      - backend/Share/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci/ci-backend.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Backend
        run: go build ./Backend/...

      - name: Run Backend tests
        run: go test -v ./Backend/... ./Share/...
