name: CI – Backend (Go)

on:
  pull_request:
    paths:
      - backend/Backend/**
      - backend/structs/**
      - backend/internal/**
      - backend/Share/**
      - backend/go.mod
      - backend/go.sum
      - .forgejo/workflows/ci/ci-backend.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Backend
        run: go build -o /dev/null ./Backend/...

      - name: Run Backend tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -v ./Backend/... ./Share/...

      - name: Set up Java (for OWASP Dependency-Check)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Run OWASP Dependency-Check
        working-directory: ${{ github.workspace }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          DC_VERSION=10.0.4
          curl -sSLo /tmp/dc.zip \
            https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip
          unzip -q /tmp/dc.zip -d /tmp/
          /tmp/dependency-check/bin/dependency-check.sh \
            --project lorax \
            --scan backend/ \
            --format JSON \
            --out . \
            --exclude "**/vendor/**" \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}

      - name: Install sonar-scanner
        env:
          SONAR_SCANNER_VERSION: 8.0.1.6346
        run: |
          export SONAR_SCANNER_HOME=$HOME/.sonar/sonar-scanner-${SONAR_SCANNER_VERSION}-linux-x64
          curl --create-dirs -sSLo $HOME/.sonar/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux-x64.zip
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          echo "$SONAR_SCANNER_HOME/bin" >> $GITHUB_PATH

      - name: Run SonarQube analysis
        working-directory: ${{ github.workspace }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: sonar-scanner -Dsonar.token=$SONAR_TOKEN
