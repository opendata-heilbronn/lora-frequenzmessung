name: Test and Deploy frontend to codeberg.org

on:
  workflow_dispatch: ~
  push:
    branches: [main, develop]
    paths:
      - frontend/**
      - docker/frontend/Dockerfile
      - .forgejo/workflows/deploy/deploy-frontend.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build

      - name: Run Playwright unit tests (mocked API)
        run: npx playwright test --project=unit

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli
          echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"

      - name: Login to Codeberg Container Registry
        run: echo "${{ secrets.FORGEJO_TOKEN }}" | docker login codeberg.org -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "primary=latest"       >> "$GITHUB_OUTPUT"
            echo "push_secondary=true"  >> "$GITHUB_OUTPUT"
          else
            echo "primary=develop"      >> "$GITHUB_OUTPUT"
            echo "push_secondary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg IMAGE_VERSION="${{ steps.tag.outputs.primary }}-${{ github.sha }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg RUN_NUMBER="${{ github.run_number }}" \
            -t codeberg.org/cfhn/lora-frequenzmessung/frontend:${{ steps.tag.outputs.primary }} \
            -t codeberg.org/cfhn/lora-frequenzmessung/frontend:v${{ github.run_number }} \
            -f docker/frontend/Dockerfile .

      - name: Push Docker image
        run: |
          docker push codeberg.org/cfhn/lora-frequenzmessung/frontend:${{ steps.tag.outputs.primary }}
          if [ "${{ steps.tag.outputs.push_secondary }}" = "true" ]; then
            docker push codeberg.org/cfhn/lora-frequenzmessung/frontend:v${{ github.run_number }}
          fi
