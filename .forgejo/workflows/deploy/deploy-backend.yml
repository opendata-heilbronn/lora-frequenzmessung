name: Deploy go-backend to codeberg.org

on:
  push:
    branches: [main, develop]
    paths:
      - backend/Backend/**
      - .forgejo/workflows/deploy/deploy-backend.yml

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io

      - name: Login to Codeberg Container Registry
        run: echo "${{ secrets.FORGEJO_TOKEN }}" | docker login codeberg.org -u "${{ github.actor }}" --password-stdin

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "primary=latest"       >> "$GITHUB_OUTPUT"
            echo "push_secondary=true"  >> "$GITHUB_OUTPUT"
          else
            echo "primary=develop"      >> "$GITHUB_OUTPUT"
            echo "push_secondary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg IMAGE_VERSION="${{ steps.tag.outputs.primary }}-${{ github.sha }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg RUN_NUMBER="${{ github.run_number }}" \
            -t codeberg.org/opendata-heilbronn/backend:${{ steps.tag.outputs.primary }} \
            -t codeberg.org/opendata-heilbronn/backend:v${{ github.run_number }} \
            -f docker/go/backend/Dockerfile .

      - name: Push Docker image
        run: |
          docker push codeberg.org/opendata-heilbronn/backend:${{ steps.tag.outputs.primary }}
          if [ "${{ steps.tag.outputs.push_secondary }}" = "true" ]; then
            docker push codeberg.org/opendata-heilbronn/backend:v${{ github.run_number }}
          fi
