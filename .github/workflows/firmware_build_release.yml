name: Build and Release PAX Sensor Firmware

on:
  workflow_dispatch: ~
  push:
    branches:
      - main
    paths:
      - sensor-pax/**
      - .github/workflows/firmware_build_release.yml

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Generate generic customs.h (no TTN credentials)
        run: |
          cat > sensor-pax/src/customs.h << 'EOF'
          #ifndef CUSTOMS_H
          #define CUSTOMS_H

          #include <cstdint>

          #define ENABLE_LOGGING 1
          #define ENABLE_DISPLAY 0
          #define ENABLE_LORA 0

          char sensor_id[] = "00000000";

          uint8_t devEui[] = {0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          uint8_t appEui[] = {0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01, 0x01};
          uint8_t appKey[] = {0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};

          uint8_t nwkSKey[] = {0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          uint8_t appSKey[] = {0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          uint32_t devAddr = (uint32_t)0x00000000;
          uint16_t userChannelsMask[6] = {0x00FF, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000};

          float factor = 0.7;
          float sleepTime = 900;

          int SensorTypFrequency = 0;
          int SensorTypBattery = 1;

          #endif // CUSTOMS_H
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO core and toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-core-${{ runner.os }}-${{ hashFiles('sensor-pax/platformio.ini') }}
          restore-keys: |
            platformio-core-${{ runner.os }}-

      - name: Cache PlatformIO library dependencies
        uses: actions/cache@v4
        with:
          path: sensor-pax/.pio/libdeps
          key: platformio-libdeps-${{ runner.os }}-${{ hashFiles('sensor-pax/platformio.ini') }}
          restore-keys: |
            platformio-libdeps-${{ runner.os }}-

      - name: Install PlatformIO CLI
        run: pip install platformio

      - name: Build firmware
        working-directory: sensor-pax
        run: platformio run --environment heltec_wifi_lora_32_V3

      - name: Compute release tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "name=firmware-pax-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "PAX Sensor Firmware ${{ steps.tag.outputs.name }}"
          body: |
            Generic PAX sensor firmware build (no TTN credentials embedded).

            **Board:** Heltec WiFi LoRa 32 V3 (ESP32-S3)
            **Commit:** ${{ github.sha }}
          files: sensor-pax/.pio/build/heltec_wifi_lora_32_V3/firmware.bin
          fail_on_unmatched_files: true
