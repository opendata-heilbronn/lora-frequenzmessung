name: built Deploy go-backend to ghcr.io
on:
  push:
    branches:
      - main
    paths:
      - backend/Backend/**
      - .github/workflows/backend_build_deploy.yml
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.7
    - name: 'Login to GitHub Container Registry'
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Build and push Docker images
      uses: docker/build-push-action@v6.7.0
      with:
        file: docker/go/backend/Dockerfile
        push: true
        tags: ghcr.io/opendata-heilbronn/backend:latest, ghcr.io/opendata-heilbronn/backend:${{ github.run_number }}