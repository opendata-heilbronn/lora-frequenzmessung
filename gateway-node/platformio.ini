; PlatformIO Project Configuration File
;
; Gateway Node for Meshtastic Mesh Network
; Receives PAX data from mesh sensors and forwards to web service
;
; Hardware: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; Requires WiFi connectivity

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
	-fexceptions
	-D NO_BENCHMARK
	-DCORE_DEBUG_LEVEL=5
	-DHELTEC_BOARD=30
	-DHELTEC_WIFI_LORA_32_V3
	-DWIFI_LORA_32_V3
	-DMCU_ESP32_S3
	-DRADIO_CHIP_SX1262

lib_deps =
	jgromes/RadioLib@^6.6.0
	arduino-libraries/ArduinoHttpClient@^0.6.1
